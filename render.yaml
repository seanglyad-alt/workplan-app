services:
  - type: web
    name: workplan-scheduler-app
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/local.db
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
